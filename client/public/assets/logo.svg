<svg xmlns="http://www.w3.org/2000/svg" width="640" height="403" viewBox="0 0 640 403" role="img" aria-labelledby="title desc">
<title id="title">QAOO AI</title>
<desc id="desc">A luminous blue and violet orbital eye symbol above the QAOO AI wordmark.</desc>
<defs>
  <linearGradient id="orbit" x1="80" y1="28" x2="565" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE"/><stop offset=".48" stop-color="#2563EB"/><stop offset="1" stop-color="#C026D3"/>
  </linearGradient>
  <linearGradient id="word" x1="85" y1="300" x2="550" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0F172A"/><stop offset=".55" stop-color="#334155"/><stop offset="1" stop-color="#64748B"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g fill="none" stroke="url(#orbit)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
  <ellipse cx="320" cy="145" rx="115" ry="76" stroke-width="19" transform="rotate(-12 320 145)"/>
  <path d="M78 196C151 61 385 20 535 105c35 20 48 47 32 72-17 28-53 42-99 49" stroke-width="17"/>
  <path d="M90 211c94 100 295 123 434 22 29-21 47-46 58-75" stroke-width="15"/>
</g>
<path d="M257 116c37-27 91-24 125 7 17 16 28 35 31 56-42 35-102 34-143-2-18-16-28-38-29-61 5 0 10 0 16 0Z" fill="url(#orbit)" opacity=".92"/>
<circle cx="320" cy="148" r="24" fill="#fff" opacity=".96"/>
<circle cx="320" cy="148" r="12" fill="#2563EB"/>
<text x="72" y="355" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" letter-spacing="1.5" fill="url(#word)">QAOO</text>
<text x="432" y="355" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" fill="url(#orbit)">AI</text>
<path d="M75 378H565" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" opacity=".9"/>
</svg>